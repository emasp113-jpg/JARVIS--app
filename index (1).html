<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b14"><link rel="manifest" href="manifest.json"><title>Jarvis</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#020b14;color:#cfefff;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
canvas{width:100%;height:200px;flex:none}
#log{flex:1;overflow-y:auto;padding:10px}
.m{max-width:85%;margin:6px 0;padding:8px 12px;border-radius:14px;white-space:pre-wrap;line-height:1.35}
.u{margin-left:auto;background:#0a3a55}.j{background:#08202f;border:1px solid #0e5a7e}
#bar{display:flex;gap:6px;padding:8px}
#t{flex:1;background:#08202f;border:1px solid #0e5a7e;color:#fff;border-radius:20px;padding:10px 14px;font-size:16px}
button{background:#0e5a7e;color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:20px}
#top{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top))}
#top button{width:36px;height:36px;font-size:16px;margin-left:4px}
</style></head><body>
<div id="top"><button id="k">🔑</button><button id="x">🗑</button></div>
<canvas id="c"></canvas><div id="log"></div>
<div id="bar"><button id="f">📎</button><input id="t" placeholder="Habla o escribe…"><button id="mic">🎤</button><button id="s">➤</button></div>
<input type="file" id="file" hidden accept="image/*,.txt,.md,.csv,.json">
<script>
const $=s=>document.querySelector(s),L=k=>{try{return JSON.parse(localStorage[k])}catch{return null}};
let key=localStorage.j_key||"",mem=L("j_mem")||[],hist=L("j_hist")||[],att=null,mode="idle";
let MODEL=localStorage.j_model||"gemini-3.8-flash";
const toG=m=>({role:m.role=="user"?"user":"model",parts:typeof m.content=="string"?[{text:m.content}]:m.content.map(x=>x.type=="image"?{inline_data:{mime_type:x.source.media_type,data:x.source.data}}:{text:x.text})});
// ---------- NIVEL 4: holograma ----------
const cv=$("#c"),g=cv.getContext("2d");let P=[],a=0;
for(let i=0;i<350;i++){const u=Math.random()*2-1,th=Math.random()*6.283,r=Math.sqrt(1-u*u);P.push([r*Math.cos(th),u,r*Math.sin(th)])}
function draw(){const w=cv.width=cv.clientWidth,h=cv.height=200;g.clearRect(0,0,w,h);a+=.01;
 const pulse=mode=="speak"?1+.12*Math.sin(Date.now()/80):mode=="listen"?1+.06*Math.sin(Date.now()/150):1,R=70*pulse;
 g.fillStyle=mode=="listen"?"#7dffb0":"#35d0ff";
 for(const[p0,p1,p2]of P){const x=p0*Math.cos(a)-p2*Math.sin(a),z=p0*Math.sin(a)+p2*Math.cos(a);
  g.globalAlpha=.35+.65*(z+1)/2;g.fillRect(w/2+x*R,100+p1*R,2,2)}
 g.globalAlpha=1;requestAnimationFrame(draw)}draw();
// ---------- UI ----------
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("#log").append(d);$("#log").scrollTop=1e9}
hist.slice(-20).forEach(m=>add(typeof m.content=="string"?m.content:"[adjunto]",m.role=="user"?"u":"j"));
$("#k").onclick=()=>{const v=prompt("Tu API key de Google Gemini (se guarda solo en este celular):",key);if(v!==null){key=v.trim();localStorage.j_key=key;const m=prompt("Modelo (déjalo así si no sabes):",MODEL);if(m){MODEL=m.trim();localStorage.j_model=MODEL}}};
$("#x").onclick=()=>{if(confirm("¿Borrar historial? (la memoria se conserva)")){hist=[];localStorage.j_hist="[]";$("#log").innerHTML=""}};
$("#f").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 if(f.type.startsWith("image/")){r.onload=()=>{att={img:r.result.split(",")[1],type:f.type};add("📎 "+f.name,"u")};r.readAsDataURL(f)}
 else{r.onload=()=>{att={txt:r.result.slice(0,30000),name:f.name};add("📎 "+f.name,"u")};r.readAsText(f)}};
// ---------- NIVEL 5: acciones (navegador, Gmail, WhatsApp) ----------
function acciones(q){const s=q.toLowerCase();let m;
 if(/abre.*whatsapp/.test(s)){open("https://wa.me/");return"Abriendo WhatsApp"}
 if(m=s.match(/(?:manda|envía|envia).*whatsapp.*?(?:a|al)\s+(\d{8,15})\s+(.+)/)){open("https://wa.me/"+m[1]+"?text="+encodeURIComponent(m[2]));return"Abriendo chat"}
 if(/abre.*(gmail|correo)/.test(s)){open("https://mail.google.com");return"Abriendo Gmail"}
 if(m=s.match(/(?:escribe|manda).*correo a\s+(\S+@\S+)\s*(.*)/)){open("mailto:"+m[1]+"?body="+encodeURIComponent(m[2]));return"Preparando correo"}
 if(/abre.*youtube/.test(s)){open("https://youtube.com");return"Abriendo YouTube"}
 if(m=s.match(/^busca\s+(.+)/)){open("https://www.google.com/search?q="+encodeURIComponent(m[1]));return"Buscando "+m[1]}
 return null}
// ---------- NIVEL 1: cerebro + memoria ----------
async function send(){const q=$("#t").value.trim();if(!q&&!att)return;$("#t").value="";add(q,"u");
 const ac=acciones(q);if(ac){add(ac,"j");speak(ac);return}
 if(!key){add("Toca 🔑 y pega tu API key primero.","j");return}
 let c=[];if(att?.img)c.push({type:"image",source:{type:"base64",media_type:att.type,data:att.img}});
 c.push({type:"text",text:(att?.txt?`[Archivo ${att.name}]\n${att.txt}\n\n`:"")+(q||"Analiza esto")});att=null;
 hist.push({role:"user",content:c.length==1?c[0].text:c});
 const sys=`Eres Jarvis, asistente personal por voz, leal, ingenioso y breve. Responde en español. Fecha: ${new Date().toLocaleString()}.
Memoria del usuario: ${mem.join(" | ")||"(vacía)"}.
Si debes recordar algo importante del usuario, añade al final [[MEM: dato]].`;
 try{let h=hist.slice(-16);while(h.length&&h[0].role!="user")h.shift();
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":key},
  body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:h.map(toG)})});
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  let t=(d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("");
  t=t.replace(/\[\[MEM:(.+?)\]\]/g,(_,m)=>{mem.push(m.trim());localStorage.j_mem=JSON.stringify(mem.slice(-100));return""}).trim();
  hist.push({role:"assistant",content:t});
  localStorage.j_hist=JSON.stringify(hist.slice(-30).map(m=>typeof m.content=="string"?m:{role:m.role,content:"[adjunto] "+(m.content[m.content.length-1].text||"")}));
  add(t,"j");speak(t)}catch(e){add("Error: "+e.message,"j")}}
$("#s").onclick=send;$("#t").onkeydown=e=>{if(e.key=="Enter")send()};
// ---------- NIVEL 2: voz ----------
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-MX";
 u.onstart=()=>mode="speak";u.onend=()=>mode="idle";speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("#mic").onclick=()=>{if(!SR)return add("Tu navegador no soporta voz. Usa Chrome.","j");
 const r=new SR();r.lang="es-MX";mode="listen";r.onresult=e=>{$("#t").value=e.results[0][0].transcript;send()};
 r.onend=()=>{if(mode=="listen")mode="idle"};r.start()};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
